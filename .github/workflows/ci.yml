name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  required:
    name: required
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check repository
        env:
          CI_DIFF_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          CI_PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/ci_check.py
      - name: Check plugin package
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r scripts/check-requirements.txt
          .venv/bin/python scripts/check_plugin.py
          .venv/bin/python scripts/check_plugin.py --self-test
